<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A responsive temple album featuring temples from around the world.">

    <title>Temple Album | WDD 131</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <header>
        <div class="header-content">
            <h2>Temple Album</h2>

            <button id="menu-button" aria-label="Open navigation menu">
                ☰

            <nav id="navigation">

    <main>
        <h1>Temple Album</h1>

        <section class="temple-grid">

            <figure>
                <img src="images/temple1.webp" alt="Beautiful temple exterior" loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple2.webp" alt="Temple building surrounded by trees" loading="lazy">
                <figcaption>Laie Hawaii Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple3.webp" alt="Temple with a beautiful blue sky" loading="lazy">

            </figure>

            <figure>

                <figcaption>Brisbane Australia Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple6.webp" alt="Temple exterior during the day" loading="lazy">

            </figure>

            </figure>

            <figure>
                <img src="images/temple9.webp" alt="Beautiful white temple building" loading="lazy">
                <figcaption>Port Vila Vanuatu Temple</figcaption>
