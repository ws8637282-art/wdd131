<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Product review confirmation page">
    <meta name="author" content="Whitney Carleen Snyder">

    <title>Review Submitted</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main class="confirmation">
        <h2>Thank You!</h2>

        <p>Your review has been successfully submitted.</p>

        <p>
            You have completed
            <strong id="reviewCount">0</strong>
            review(s).
        </p>

        <a href="form.html" class="button">Write Another Review</a>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Whitney Carleen Snyder | Samoa</p>
        <p id="lastModified"></p>
    </footer>

    <script>
        let reviewCount = Number(localStorage.getItem("reviewCount")) || 0;

        reviewCount++;

        localStorage.setItem("reviewCount", reviewCount);

        document.querySelector("#reviewCount").textContent = reviewCount;
    </script>

</body>
</html>
