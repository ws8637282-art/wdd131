<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Complete this product review form to rate a product, share useful features, provide a review, and tell us about your experience.">
    <meta name="author" content="Whitney Carleen Snyder">

    <title>Product Review</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <!-- Overall Rating -->
            <fieldset>
                <legend>Overall Rating</legend>

                <div class="rating">

                    <label for="rating1">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        ☆
                    </label>

                    <label for="rating2">
                        <input type="radio" id="rating2" name="rating" value="2" required>
                        ☆☆
                    </label>

                    <label for="rating3">
                        <input type="radio" id="rating3" name="rating" value="3" required>
                        ☆☆☆
                    </label>

                    <label for="rating4">
                        <input type="radio" id="rating4" name="rating" value="4" required>
                        ☆☆☆☆
                    </label>

                    <label for="rating5">
                        <input type="radio" id="rating5" name="rating" value="5" required>
                        ☆☆☆☆☆
                    </label>

                </div>
            </fieldset>

            <!-- Installation Date -->
            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <!-- Useful Features -->
            <fieldset>
                <legend>Useful Features <span>(Check all that apply)</span></legend>

                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label for="ease">
                    <input type="checkbox" id="ease" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>

            </fieldset>

            <!-- Written Review -->
            <label for="review">
                Written Review <span>(Optional)</span>
            </label>

            <textarea id="review" name="review" rows="6"></textarea>

            <!-- User Name -->
            <label for="userName">
                Your Name <span>(Optional)</span>
            </label>

            <input type="text" id="userName" name="userName">

            <!-- Submit -->
            <input type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> |
            Whitney Carleen Snyder | Samoa
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
